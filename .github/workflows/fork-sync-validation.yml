name: Fork sync validation
on:
  push:
    branches: ['org-sync/upstream-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install reviewed test dependencies
        run: python -m pip install -r packaging-youtube-thumbnails/requirements.txt -r shortform-production/requirements.txt
      - name: Run synthetic Python fixtures
        run: |
          set -euo pipefail
          for directory in commenter-talent-scan/tests leveling-up-content-engine/tests packaging-youtube-thumbnails/tests reimagine-work/judge/tests shortform-format-library/tests shortform-production/tests sidebar-prioritizer/tests; do
            python -m unittest discover -s "$directory" -v
          done
      - name: Run synthetic funnel fixtures
        run: node --test proactive-helpfulness/tests/funnel.test.mjs
